[workspace]
resolver = "2"
members = [
    "crates/rts-core",
    "crates/rts-formats",
    "crates/rts-sim",
    "crates/map-editor-model",
    "crates/tiberian-dawn",
    "crates/red-alert",
    "crates/engine/rts-render",
    "crates/engine/rts-net",
    "crates/launcher/rts-launcher",
    "crates/editor/map-editor",
    "apps/cnc-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["CnC_Remastered contributors"]

[workspace.dependencies]
rts-core = { path = "crates/rts-core" }
rts-formats = { path = "crates/rts-formats" }
rts-sim = { path = "crates/rts-sim" }
map-editor-model = { path = "crates/map-editor-model" }
tiberian-dawn = { path = "crates/tiberian-dawn" }
red-alert = { path = "crates/red-alert" }
rts-render = { path = "crates/engine/rts-render" }
rts-net = { path = "crates/engine/rts-net" }

eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "process"] }
